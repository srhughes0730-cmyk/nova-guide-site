<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Nova Guide</title>
<style>
  :root{--bg:#0a0e1f;--bg2:#0d1330;--card:rgba(255,255,255,.04);--ink:#eef2ff;
    --muted:#a9b2d0;--line:rgba(255,255,255,.10);--teal:#5eead4;--violet:#a78bfa;--accent:#7dd3fc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh;
    display:grid;place-items:center;text-align:center;padding:24px}
  .stars{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(1000px 600px at 80% -10%, #1a2352 0%, transparent 60%),
    linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%)}
  .stars::after{content:"";position:absolute;inset:0;opacity:.5;background-image:
    radial-gradient(1.4px 1.4px at 20% 30%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 80% 20%, #cfe3ff, transparent),
    radial-gradient(1px 1px at 40% 70%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 65% 55%, #dbeafe, transparent);background-repeat:no-repeat}
  h1{font-size:clamp(3rem,12vw,5rem);letter-spacing:-1px;
    background:linear-gradient(120deg,var(--teal),var(--accent),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--muted);margin-top:8px;font-size:1.1rem}
  a{display:inline-block;margin-top:26px;padding:12px 24px;border-radius:12px;font-weight:600;
    text-decoration:none;background:linear-gradient(120deg,var(--teal),var(--accent));color:#06121a}
</style>
</head>
<body>
<div class="stars"></div>
<div>
  <h1>404</h1>
  <p>This page drifted off the star chart.</p>
  <a href="/">Back to Nova Guide</a>
</div>
</body>
</html>
